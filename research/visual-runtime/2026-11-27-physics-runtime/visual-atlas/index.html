<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Performable Physics / Visual Atlas A01</title><style>
*{box-sizing:border-box}body{background:#101010;color:#eee9df;font:14px system-ui;margin:0}main{max-width:1250px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}h1{font-weight:500;letter-spacing:-.06em;font-size:clamp(28px,5vw,54px);margin:8px 0}small,p{color:#aaa9a4;line-height:1.55}select,button{background:#202020;color:#eee9df;border:1px solid #555;padding:9px;border-radius:2px}canvas{width:100%;height:min(62vh,650px);min-height:280px;display:block;background:#080808;touch-action:none}section{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}input{accent-color:#e4decf}#meta{font:12px monospace;color:#aaa}#desc{max-width:850px} </style><main><header><div><small>VISUAL RESEARCH / A01 · TEN SKETCHES</small><h1>PERFORMABLE PHYSICS</h1></div><select id="study"></select></header><p id="desc"></p><canvas id="view"></canvas><section><button id="pause">暂停</button><button id="reset">重置</button><button id="auto">自动采样：开</button><button id="audio">声音：关</button><label>切面 <input id="slice" type="range" min="-1" max="1" step=".02" value="0"></label><label>视角 <input id="yaw" type="range" min="-180" max="180" value="18"></label></section><div id="meta"></div><p>拖动施加局部输入；视角滑杆只改变观看方向。点、线与历史采样使用同一三维状态。CPU 流场、弹道、格架传播和曲线采样是不同模型；不是十种真实流体。渲染为 Canvas 透视投影（非 WebGL 深度缓冲）。声音是可关闭的 WebAudio 测试音，不是 Ableton/Max 联动；Reflection Matter 与 Hidden Instrument 尚未实现。</p></main><script>function createFluid(n=16,count=4096,seed=27){
  const N=n*n*n, mk=()=>new Float32Array(N), idx=(x,y,z)=>((x+n)%n)+n*((y+n)%n)+n*n*((z+n)%n);
  let U=[mk(),mk(),mk()], B=[mk(),mk(),mk()], P=mk(), Q=mk(), D=mk(), particles=new Float32Array(count*3), step=0;
  let s=seed>>>0;const rand=()=>{s=(Math.imul(1664525,s)+1013904223)>>>0;return s/4294967296};
  const nb=Array.from({length:6},()=>new Int32Array(N));
  for(let z=0;z<n;z++)for(let y=0;y<n;y++)for(let x=0;x<n;x++){let i=idx(x,y,z);[idx(x+1,y,z),idx(x-1,y,z),idx(x,y+1,z),idx(x,y-1,z),idx(x,y,z+1),idx(x,y,z-1)].forEach((v,j)=>nb[j][i]=v)}
  const wrap=x=>((x%n)+n)%n;
  function sample(a,x,y,z){x=wrap(x);y=wrap(y);z=wrap(z);let i=Math.floor(x),j=Math.floor(y),k=Math.floor(z),tx=x-i,ty=y-j,tz=z-k;let i1=(i+1)%n,j1=(j+1)%n,k1=(k+1)%n;let b=k*n*n,c=k1*n*n;let l=(x,y,t)=>x+(y-x)*t;return l(l(l(a[b+j*n+i],a[b+j*n+i1],tx),l(a[b+j1*n+i],a[b+j1*n+i1],tx),ty),l(l(a[c+j*n+i],a[c+j*n+i1],tx),l(a[c+j1*n+i],a[c+j1*n+i1],tx),ty),tz)}
  function vel(a,x,y,z,out){out[0]=sample(a[0],x-.5,y,z);out[1]=sample(a[1],x,y-.5,z);out[2]=sample(a[2],x,y,z-.5);return out}
  function reset(){s=seed>>>0;for(let a of [...U,...B,P,Q,D])a.fill(0);step=0;for(let i=0;i<count;i++){// elongated tracer seed cloud, true XYZ
    particles[i*3]=n*(.26+.48*rand());particles[i*3+1]=n*(.30+.40*rand());particles[i*3+2]=n*(.28+.44*rand())
  }}
  function impulse(cx,cy,cz,dx,dy,dz,strength=6,radius=.18){const cc=[cx*n,cy*n,cz*n],dv=[dx,dy,dz],r=radius*n;for(let z=0;z<n;z++)for(let y=0;y<n;y++)for(let x=0;x<n;x++){const i=idx(x,y,z);for(let a=0;a<3;a++){let xx=x+(a===0?.5:0)-cc[0],yy=y+(a===1?.5:0)-cc[1],zz=z+(a===2?.5:0)-cc[2];xx-=n*Math.round(xx/n);yy-=n*Math.round(yy/n);zz-=n*Math.round(zz/n);let f=Math.exp(-(xx*xx+yy*yy+zz*zz)/(2*r*r));U[a][i]+=dv[a]*strength*f}}}
  function divergence(){let t=0;for(let i=0;i<N;i++){const d=U[0][i]-U[0][nb[1][i]]+U[1][i]-U[1][nb[3][i]]+U[2][i]-U[2][nb[5][i]];D[i]=d;t+=d*d}return Math.sqrt(t/N)}
  function project(iters=32){const before=divergence();P.fill(0);Q.fill(0);for(let k=0;k<iters;k++){for(let i=0;i<N;i++){Q[i]=(P[nb[0][i]]+P[nb[1][i]]+P[nb[2][i]]+P[nb[3][i]]+P[nb[4][i]]+P[nb[5][i]]-D[i])/6}[P,Q]=[Q,P]}
    for(let i=0;i<N;i++){U[0][i]-=P[nb[0][i]]-P[i];U[1][i]-=P[nb[2][i]]-P[i];U[2][i]-=P[nb[4][i]]-P[i]}return [before,divergence()]}
  let metric={before:0,after:0,energy:0,step:0};
  const v=new Float64Array(3),v2=new Float64Array(3);
  function tick(dt=1/30,projection=true,iters=32){if(!(dt>0&&dt<=.1))throw new Error("dt out of range");
    for(let z=0;z<n;z++)for(let y=0;y<n;y++)for(let x=0;x<n;x++){let i=idx(x,y,z);for(let a=0;a<3;a++){let xx=x+(a===0?.5:0),yy=y+(a===1?.5:0),zz=z+(a===2?.5:0);vel(U,xx,yy,zz,v);B[a][i]=sample(U[a],x-v[0]*dt,y-v[1]*dt,z-v[2]*dt)*.998}}
    [U,B]=[B,U];let m=projection?project(iters):[divergence(),divergence()];let energy=0;for(let i=0;i<N;i++)energy+=(U[0][i]**2+U[1][i]**2+U[2][i]**2)/2/N;
    for(let i=0;i<particles.length;i+=3){let x=particles[i],y=particles[i+1],z=particles[i+2];vel(U,x,y,z,v);vel(U,x+v[0]*dt*.5,y+v[1]*dt*.5,z+v[2]*dt*.5,v2);particles[i]=wrap(x+v2[0]*dt);particles[i+1]=wrap(y+v2[1]*dt);particles[i+2]=wrap(z+v2[2]*dt)}
    metric={before:m[0],after:m[1],energy,step:++step};return metric
  }
  reset();return {n,particles,reset,impulse,tick,project,divergence,metrics:()=>({...metric}),finite:()=>[...U,particles].every(a=>a.every(Number.isFinite))}
}

function makeStudy(id,seed=27){
 let seedState=seed>>>0;const rnd=()=>((seedState=(Math.imul(1664525,seedState)+1013904223)>>>0)/4294967296);
 let f=null,t=0,points=[],vel=[],history=[],trace=[],scar=[],energy=0,gravity=0,clock=0,lastInput=null,carry=0,impulseCount=0;
 const fluid=["01-04","03-03","04-03","08-01","11-01"].includes(id);
 if(fluid){f=createFluid(12,3072,seed); if(id==="03-03"){f.impulse(.30,.35,.5,1,0,.15,8,.16);f.impulse(.70,.65,.5,-1,0,-.15,8,.16)}else if(id==="04-03"){for(let j=0;j<8;j++){let a=j*Math.PI/4;f.impulse(.5+.18*Math.cos(a),.5+.18*Math.sin(a),.5,Math.cos(a),Math.sin(a),.8,2,.08)}}else f.impulse(.42,.5,.5,1,.15,.2,6,.19)}
 if(id==="06-01"){for(let z=0;z<7;z++)for(let y=0;y<7;y++)for(let x=0;x<7;x++){points.push([x/3-1,y/3-1,z/3-1]);vel.push(0)}vel[171]=1}
 if(id==="07-04"||id==="09-03"){for(let i=0;i<600;i++){points.push([(rnd()-.5)*1.7,(rnd()-.5)*1.7,(rnd()-.5)*1.7]);vel.push([(rnd()-.5)*.3,(rnd()-.5)*.3,(rnd()-.5)*.3])}}
 function input(x,y,z=0){x=Math.max(-.95,Math.min(.95,x));y=Math.max(-.95,Math.min(.95,y));z=Math.max(-.95,Math.min(.95,z));let p=[x,y,z];if(id==="02-01"||id==="05-01"){if(!lastInput){trace.push(p);lastInput=p;carry=0;return}let a=lastInput,d=Math.hypot(...p.map((v,i)=>v-a[i])),q=.065;while(d+carry>=q&&d>1e-9){let frac=(q-carry)/d;a=a.map((v,i)=>v+(p[i]-v)*frac);trace.push(a);if(trace.length>900)trace.shift();d=Math.hypot(...p.map((v,i)=>v-a[i]));carry=0}carry+=d;lastInput=p;return}
 if(f){f.impulse((x+1)/2,(y+1)/2,(z+1)/2,.7,.25,.35,3,.12);impulseCount++}
 if(id==="06-01"){let k=points.reduce((b,v,i)=>Math.hypot(...v.map((c,j)=>c-p[j]))<Math.hypot(...points[b].map((c,j)=>c-p[j]))?i:b,0);vel[k]=1}
 if(id==="07-04")gravity=x*Math.PI;
 if(id==="09-03"){scar.push(p);if(scar.length>96)scar.shift()}
 }
 function release(){lastInput=null;carry=0}
 function tick(){t+=1/30;clock++;if(f){if(id==="01-04"&&clock%12===1){let sign=Math.sin(t*.8);for(let s of [-1,1])f.impulse(.5+s*.26,.5,.5,-s*sign,0,0,1,.14)}let m=f.tick(1/30,true,24);energy=m.energy;let arr=f.particles;points=[];for(let i=0;i<arr.length;i+=3)points.push([arr[i]*2/f.n-1,arr[i+1]*2/f.n-1,arr[i+2]*2/f.n-1]);}
 if(id==="06-01"){let nv=vel.slice();for(let i=0;i<343;i++){let x=i%7,y=Math.floor(i/7)%7,z=Math.floor(i/49),sum=0,k=0;for(let j of [x>0?i-1:-1,x<6?i+1:-1,y>0?i-7:-1,y<6?i+7:-1,z>0?i-49:-1,z<6?i+49:-1])if(j>=0){sum+=vel[j];k++}nv[i]=Math.max(0,vel[i]*.94+sum/k*.058)}vel=nv;energy=vel.reduce((a,b)=>a+b*b,0)/343}
 if(id==="07-04"||id==="09-03"){energy=0;for(let i=0;i<points.length;i++){let p=points[i],v=vel[i];if(id==="07-04"){v[0]+=Math.sin(gravity)*.035;v[1]-=Math.cos(gravity)*.035}else for(let s of scar){let d=p.map((x,k)=>s[k]-x),l=Math.hypot(...d);if(l<.35&&l>.001){v[0]+=d[1]*.005;v[1]-=d[0]*.005;v[2]+=d[2]*.002}}for(let j=0;j<3;j++){v[j]*=.994;p[j]+=v[j]/30;if(Math.abs(p[j])>.96){p[j]=Math.sign(p[j])*.96;v[j]*=-.65}}energy+=v.reduce((a,b)=>a+b*b,0)/points.length}}
 if(id==="02-01"||id==="05-01"){if(!lastInput&&clock%2===0){input(.7*Math.sin(t*.75),.54*Math.sin(t*1.13),.6*Math.cos(t*.75));lastInput=null;/* automatic path uses separate persistent sampling below */} }
 if(f&&clock%4===0){history.push(points.filter((_,i)=>i%16===0).map(p=>p.slice()));if(history.length>5)history.shift()}
 }
 // Automatic path uses continuous spatial sampling, same rule as manual input.
 function auto(){if(id==="02-01"||id==="05-01"){input(.72*Math.sin(t*.8),.50*Math.sin(t*1.21),.58*Math.cos(t*.8))}}
 return {id,tick,auto,input,release,get:()=>({points,trace,history,scar,vel,energy,t,impulseCount}),finite:()=>[...points,...trace,...scar].every(p=>p.every(Number.isFinite))&&Number.isFinite(energy)}
}
const studies=[{"id":"01-04","family":"Boundary / 边界","lineage":"ENTROPY / REACTOR","title":"Breath Box","mechanism":"周期性径向力而非假称密闭压缩","input":"慢速径向张力","visual":"收放的薄壳","music":"乐句起落","gate":"不依赖相机缩放","anchor":true,"status":"PROPOSED"},{"id":"02-01","family":"Drop Flow / 滴流","lineage":"Drop Flow","title":"Distance Script","mechanism":"按空间距离重采样笔迹并注入动量","input":"手移过阈值","visual":"等距点与细线","music":"音符间距控制采样","gate":"快慢手速下点间距近似恒定","anchor":true,"status":"PROPOSED"},{"id":"03-03","family":"Return / 回流","lineage":"Drop Flow / 自主系统","title":"Counterflow","mechanism":"相反动量注入","input":"双手对向","visual":"两组对流丝束","music":"问答声部","gate":"交界面随状态变化","anchor":true,"status":"PROPOSED"},{"id":"04-03","family":"Vortex / 涡旋","lineage":"Drop Flow / TIMER","title":"Vortex Ring","mechanism":"局部环状动量场","input":"一次发射","visual":"悬浮环","music":"单次乐句起音","gate":"释放后传播需实测","anchor":true,"status":"PROPOSED"},{"id":"05-01","family":"Timer / 时间","lineage":"TIMER","title":"Distance Clock","mechanism":"移动累计距离跨过阈值生成新点","input":"控制步距","visual":"等距切片","music":"节拍与距离解耦","gate":"点数取决于路程而非 FPS","anchor":true,"status":"PROPOSED"},{"id":"06-01","family":"Autonomy / 无需进一步输入","lineage":"No Further Input Required","title":"Breathing Lattice","mechanism":"固定格点邻域激发传播","input":"播种局部状态","visual":"米白节点/细格架","music":"长音分层","gate":"撤去输入仍演变","anchor":true,"status":"PROPOSED"},{"id":"07-04","family":"Weight / 重量","lineage":"ENTROPY / REACTOR","title":"Tilted Gravity","mechanism":"重力方向旋转与反弹","input":"倾转控制","visual":"倾斜粒子沉积","music":"声像变化","gate":"转向有惯性","anchor":true,"status":"PROPOSED"},{"id":"08-01","family":"Observation / 观察","lineage":"ENTROPY / REACTOR","title":"Volume Slice","mechanism":"按世界坐标选择薄层","input":"移动切面","visual":"黑底细剖面","music":"频带分区","gate":"不改物理状态","anchor":true,"status":"PROPOSED"},{"id":"09-03","family":"Memory / 记忆","lineage":"No Further Input Required / TIMER","title":"Scar Space","mechanism":"持久空间痕迹反馈为局部力","input":"划过区域","visual":"残留细纹","music":"残响影响后续","gate":"新状态确受历史影响","anchor":true,"status":"PROPOSED"},{"id":"11-01","family":"Signal / 信号","lineage":"Reverse Neural Score / Performable Music","title":"Energy Choir","mechanism":"有界动能统计控制音色","input":"注入力","visual":"稀疏点与线","music":"共振/音色深度","gate":"统计与声音映射可录","anchor":true,"status":"PROPOSED"}];
const $=x=>document.getElementById(x),c=$("view"),ctx=c.getContext("2d");for(let s of studies){let o=document.createElement("option");o.value=s.id;o.textContent=s.id+" / "+s.title;$("study").append(o)}let m,run=true,auto=true,ac=null,osc=null,gain=null,filter=null,last=performance.now(),acc=0,drag=false;function reset(){let s=studies.find(s=>s.id===$("study").value);m=makeStudy(s.id);$("desc").textContent=s.mechanism+" · "+s.visual+" · 验收："+s.gate;acc=0}reset();$("study").onchange=reset;$("reset").onclick=reset;$("pause").onclick=()=>{run=!run;$("pause").textContent=run?"暂停":"继续"};$("auto").onclick=()=>{auto=!auto;m.release();$("auto").textContent="自动采样："+(auto?"开":"关")};$("audio").onclick=async()=>{if(ac){await ac.close();ac=null;osc=null;$("audio").textContent="声音：关";return}ac=new AudioContext();await ac.resume();osc=ac.createOscillator();filter=ac.createBiquadFilter();gain=ac.createGain();osc.type="triangle";osc.frequency.value=110;filter.type="lowpass";filter.frequency.value=300;gain.gain.value=0;osc.connect(filter).connect(gain).connect(ac.destination);osc.start();$("audio").textContent="声音：开"};function pointer(e){let r=c.getBoundingClientRect();m.input((e.clientX-r.left)/r.width*2-1,1-(e.clientY-r.top)/r.height*2,0)}c.onpointerdown=e=>{drag=true;c.setPointerCapture(e.pointerId);m.release();pointer(e)};c.onpointermove=e=>{if(drag)pointer(e)};c.onpointerup=c.onpointercancel=()=>{drag=false;m.release()};function frame(now){let elapsed=Math.min(.12,(now-last)/1000);last=now;if(run){acc+=elapsed;let k=0;while(acc>=1/30&&k++<2){if(auto&&!drag)m.auto();m.tick();acc-=1/30}if(acc>.15)acc=0}let s=m.get(),d=Math.min(devicePixelRatio||1,2),w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(c.width!==w||c.height!==h){c.width=w;c.height=h}ctx.fillStyle="#080808";ctx.fillRect(0,0,w,h);let yaw=+$("yaw").value*Math.PI/180,cs=Math.cos(yaw),sn=Math.sin(yaw),sc=Math.min(w,h)*.38;function proj(p){let x=p[0]*cs+p[2]*sn,z=-p[0]*sn+p[2]*cs,y=p[1]*.94-z*.24;let k=3.8/(3.8-z);return [w/2+x*sc*k,h/2-y*sc*k,z,k]}function line(a,b,alpha=.3){let p=proj(a),q=proj(b);ctx.strokeStyle="rgba(233,225,209,"+alpha+")";ctx.lineWidth=.75*d;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke()}if(m.id==="06-01"){for(let i=0;i<s.points.length;i++){let x=i%7,y=Math.floor(i/7)%7,z=Math.floor(i/49);for(let j of [x<6?i+1:-1,y<6?i+7:-1,z<6?i+49:-1])if(j>=0)line(s.points[i],s.points[j],.07+Math.min(.5,s.vel[i]*3))}}if(s.history.length>1)for(let j=1;j<s.history.length;j++)for(let i=0;i<s.history[j].length;i++){let a=s.history[j-1][i],b=s.history[j][i];if(Math.hypot(...a.map((v,k)=>v-b[k]))<.5)line(a,b,.12+j*.05)}for(let i=1;i<s.trace.length;i++)if(Math.hypot(...s.trace[i].map((v,j)=>v-s.trace[i-1][j]))<.15)line(s.trace[i-1],s.trace[i],.6);for(let i=1;i<s.scar.length;i++)line(s.scar[i-1],s.scar[i],.3);let pts=(m.id==="02-01"||m.id==="05-01"?s.trace:s.points).filter(p=>m.id!=="08-01"||Math.abs(p[2]-+$("slice").value)<.13).map((p,i)=>({p:proj(p),i})).sort((a,b)=>a.p[2]-b.p[2]);for(let {p,i} of pts){let a=m.id==="06-01"?Math.min(.95,.14+(s.vel[i]||0)*5):.28+.55*(p[2]+1)/2;ctx.fillStyle="rgba(235,229,215,"+Math.max(.08,Math.min(.95,a))+")";ctx.beginPath();ctx.arc(p[0],p[1],Math.max(.65,Math.min(2.8,p[3]*d*(m.id==="05-01"?1.6:.8))),0,Math.PI*2);ctx.fill()}if(ac&&gain){let en=Math.min(1,Math.max(0,s.energy));gain.gain.setTargetAtTime(run?Math.min(.045,en*.025):0,ac.currentTime,.08);filter.frequency.setTargetAtTime(180+en*1600,ac.currentTime,.1)}$("meta").textContent=m.id+" / t="+s.t.toFixed(2)+" / visible="+pts.length+" / energy="+s.energy.toFixed(5)+" / CPU sketch";requestAnimationFrame(frame)}requestAnimationFrame(frame);</script>
