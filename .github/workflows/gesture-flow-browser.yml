name: Gesture Dynamics V3 real browser smoke
on:
  pull_request:
    paths:
      - 'spatial-playground/hand-osc-lab/gesture-dynamics*'
      - 'spatial-playground/hand-osc-lab/gesture-stream*'
      - 'spatial-playground/hand-osc-lab/browser-gesture-flow.cjs'
      - '.github/workflows/gesture-flow-browser.yml'
  push:
    branches: [main]
    paths:
      - 'spatial-playground/hand-osc-lab/gesture-dynamics*'
      - 'spatial-playground/hand-osc-lab/gesture-stream*'
      - 'spatial-playground/hand-osc-lab/browser-gesture-flow.cjs'
      - '.github/workflows/gesture-flow-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser QA
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve repository over HTTP
        run: |
          python3 -m http.server 8879 --bind 127.0.0.1 > /tmp/gesture-http.log 2>&1 &
          sleep 2
          curl -f http://127.0.0.1:8879/spatial-playground/hand-osc-lab/gesture-dynamics.html >/dev/null
      - name: Actual V3 renderer and input smoke
        run: node spatial-playground/hand-osc-lab/browser-gesture-flow.cjs
      - name: Keep desktop/mobile visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gesture-v3-browser-qa
          path: |
            gesture-v3-fist-charge.png
            gesture-v3-jet-stream.png
            gesture-v3-stripe-stream.png
            gesture-v3-open-burst.png
            gesture-v3-mobile.png
          if-no-files-found: ignore
          retention-days: 14
