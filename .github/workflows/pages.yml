name: Deploy Performable Music Labs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - studies/005-strudel-preset-transitions/**
      - spatial-playground/**
      - visual-runtime-lab/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check narrative runtime JavaScript
        run: node --check visual-runtime-lab/app.js
      - name: Package static audition lab
        run: |
          mkdir -p _site/studies/005-strudel-preset-transitions _site/spatial-playground _site/visual-runtime-lab
          cp index.html _site/index.html
          cp studies/005-strudel-preset-transitions/index.html studies/005-strudel-preset-transitions/controls.js _site/studies/005-strudel-preset-transitions/
          cp -R studies/005-strudel-preset-transitions/presets _site/studies/005-strudel-preset-transitions/presets
          cp -R spatial-playground/. _site/spatial-playground/
          cp visual-runtime-lab/index.html visual-runtime-lab/app.js _site/visual-runtime-lab/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
