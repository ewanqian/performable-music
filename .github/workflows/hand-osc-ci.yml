name: Hand OSC Lab static and behavioral checks

on:
  push:
    branches: [main]
    paths:
      - spatial-playground/hand-osc-lab/**
      - .github/workflows/hand-osc-ci.yml
  pull_request:
    paths:
      - spatial-playground/hand-osc-lab/**
      - .github/workflows/hand-osc-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spatial-playground/hand-osc-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check engine.mjs
          node --check app.mjs
          node --check bridge.mjs
          node --check engine.test.mjs
          node --check instrument-gesture.mjs
          node --check instrument-gesture.test.mjs
          node --check instrument-audio.test.mjs
          node --check instrument-audio.mjs
          node --check instrument-ui.mjs
          node --check organic-engine.mjs
          node --check organic-audio.mjs
          node --check organic-ui.mjs
          node --check organic-engine.test.mjs
          node --check studies-engine.mjs
          node --check studies-engine.test.mjs
          node --check studies-audio.mjs
          node --check studies-ui.mjs
          node --check atlas-engine.mjs
          node --check atlas-engine.test.mjs
          node --check atlas-ui.mjs
          node --check score-map.mjs
          node --check score-map.test.mjs
          node --check archive/sigil-simulator.mjs
          node --check handseal-engine.mjs
          node --check handseal-engine.test.mjs
          node --check handseal-trainer.mjs
          node --check approach-engine.mjs
          node --check approach-engine.test.mjs
          node --check label-layout.mjs
          node --check label-layout.test.mjs
          node --check neuro-engine.mjs
          node --check neuro-engine.test.mjs
          node --check neural-engine.mjs
          node --check neural-engine.test.mjs
          node --check neural-ui.mjs
          node --check ../../protocols/show-score.mjs
          node --check ../../protocols/show-score.test.mjs
      - name: Test joint geometry and spatial zones
        run: node --test engine.test.mjs instrument-gesture.test.mjs instrument-audio.test.mjs organic-engine.test.mjs studies-engine.test.mjs atlas-engine.test.mjs handseal-engine.test.mjs score-map.test.mjs approach-engine.test.mjs label-layout.test.mjs neuro-engine.test.mjs neural-engine.test.mjs ../../protocols/show-score.test.mjs
      - name: Check package dependency installation
        run: npm install --ignore-scripts --no-audit --no-fund
