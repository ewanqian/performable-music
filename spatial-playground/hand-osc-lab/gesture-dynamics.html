<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090c">
<title>Gesture Dynamics — Spatial Particle Simulator</title>
<style>
:root{color-scheme:dark;--bg:#07090c;--fg:#f1f0ec;--dim:#a3a8ae;--line:#30333a;--accent:#e6bc87}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
#view{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
body::before{content:"";pointer-events:none;position:fixed;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 25%,rgba(0,0,0,.44) 100%)}
header{position:fixed;top:22px;left:25px;pointer-events:none;max-width:min(60vw,520px)}
.eyebrow{font-size:10px;letter-spacing:.19em;color:var(--accent)}
h1{font:400 clamp(25px,4vw,54px)/1.04 Georgia,"Times New Roman",serif;letter-spacing:-.035em;margin:11px 0 12px}
header p{color:var(--dim);max-width:370px;font-size:11px;line-height:1.8}
#status{position:fixed;right:22px;top:22px;max-width:270px;color:var(--accent);font-size:11px;text-align:right;pointer-events:none;white-space:pre-line}
#controls{position:fixed;left:25px;bottom:23px;right:25px;display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;justify-content:space-between}
.panel{background:rgba(10,13,18,.86);border:1px solid var(--line);padding:11px 13px;backdrop-filter:blur(16px)}
.label{font-size:10px;color:var(--dim);letter-spacing:.11em;margin:0 0 9px}
.buttons{display:flex;gap:7px;flex-wrap:wrap}
button,select{appearance:none;background:#13171d;border:1px solid #40454d;color:var(--fg);font:11px ui-monospace,Menlo,monospace;padding:9px 12px;cursor:pointer;border-radius:0}
button:hover,button:focus-visible,select:hover{border-color:#dcc09b;outline:none}
button[aria-pressed=true]{background:#dfc5a5;color:#191a1d;border-color:#dfc5a5}
button.xr{background:#e9ddca;color:#121315;font-weight:700;border-color:#e9ddca}
button:disabled{opacity:.35;cursor:not-allowed}
select{padding-right:18px;min-width:150px}
#help{font-size:10px;color:#8d9298;line-height:1.75;margin:8px 0 0}
a{color:inherit}
@media(max-width:760px){header{left:14px;top:12px;max-width:70vw}header p{max-width:260px}#status{right:12px;top:14px;max-width:130px;font-size:9px}#controls{left:10px;right:10px;bottom:10px;gap:8px}.panel{padding:8px}.buttons{gap:4px}button,select{font-size:10px;padding:7px}#help{display:none}h1{font-size:28px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head><body>
<canvas id="view" aria-label="三维空间粒子动力学预览"></canvas>
<header>
<div class="eyebrow">SPATIAL PLAYGROUND / EXPERIMENT 12</div>
<h1>Gesture<br>Dynamics.</h1>
<p>物理空间不是预设动画。剑指引导运动，张掌炸开粒子，握拳重新聚集。默认静音，不连接 OSC，不上传手部数据。</p>
</header>
<div id="status" role="status">INITIALIZING …</div>
<div id="controls">
  <div class="panel">
    <div class="label">DESKTOP SIMULATION / 键盘 1·2·3·0</div>
    <div class="buttons">
      <button data-gesture="sword" aria-pressed="false">01 剑指 / DRIVE</button>
      <button data-gesture="open" aria-pressed="false">02 张掌 / BURST</button>
      <button data-gesture="fist" aria-pressed="false">03 握拳 / ATTRACT</button>
      <button data-gesture="neutral" aria-pressed="true">00 释放</button>
    </div>
    <div id="help">鼠标定位与指向 · R 重新聚合 · 桌面操作是模拟，不代表 Quest 识别成功</div>
  </div>
  <div class="panel">
    <div class="label">PARTICLE FIELD</div>
    <select id="shape" aria-label="粒子空间造型">
      <option value="cloud">01 / VOLUMETRIC CLOUD</option>
      <option value="torus">02 / TOROIDAL FIELD</option>
      <option value="helix">03 / DOUBLE-WOUND SPIRAL</option>
    </select>
  </div>
  <div class="panel">
    <div class="label">META QUEST 3 / WEBXR</div>
    <div class="buttons">
      <button id="enter-ar" class="xr" disabled>ENTER MR</button>
      <button id="enter-vr" disabled>ENTER VR</button>
      <button id="exit-xr" hidden>EXIT XR</button>
    </div>
    <div id="help-xr" style="font-size:10px;color:#a3a8ae;margin-top:8px">需在 Quest Browser 的 HTTPS 页面开启手部追踪</div>
  </div>
</div>
<script type="module" src="./gesture-dynamics-ui.mjs"></script>
</body></html>
